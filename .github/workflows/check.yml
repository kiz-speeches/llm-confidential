name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install API test dependencies (runtime comes from pinned vLLM image)
        run: python -m pip install fastapi==0.138.0 httpx==0.28.1 uvicorn==0.35.0 pydantic==2.13.4
      - run: python -m unittest discover -s tests -v
      - name: Check encrypted CPU gateway protocol (mock hardware)
        run: |
          python -m pip install cryptography==46.0.5
          python -m unittest discover -s tee-tests -v
